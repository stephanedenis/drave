<head>

  <style>
    .colonnes { column-count: 2; column-gap: 2rem; }
  </style>
</head>
<body>
  <h1>Lecture en deux colonnes</h1>
  <div class="colonnes">
    <p>Première colonne : le DOM commence ici et la lecture doit commencer ici.</p>
    <p>La première colonne continue avec une deuxième phrase.</p>
    <p>Seconde colonne : le DOM continue après la première colonne.</p>
    <p>La seconde colonne se termine ici.</p>
  </div>
