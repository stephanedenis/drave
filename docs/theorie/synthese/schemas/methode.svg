<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="DejaVu Sans, Arial, sans-serif">
  <title>La méthode</title>
  <desc>Mesurer, contrôler, écrire, porter ; une porte qui peut échouer.</desc>
  <defs>
    <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
  </defs>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">La méthode : mesurer, contrôler, écrire, porter</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#475569">Un chiffre sans contrôle n'est pas un résultat ; une affirmation sans porte n'est pas une capacité.</text>

  <rect x="40" y="110" width="180" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">1 · Mesurer</text>
  <text x="130" y="164" text-anchor="middle" font-size="11.5" fill="#475569">le chiffre, l'unité, le dispositif</text>

  <rect x="255" y="110" width="180" height="80" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="345" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">2 · Contrôler</text>
  <text x="345" y="164" text-anchor="middle" font-size="11.5" fill="#475569">hasard, paires mélangées</text>

  <rect x="470" y="110" width="180" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="560" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">3 · Écrire</text>
  <text x="560" y="164" text-anchor="middle" font-size="11.5" fill="#475569">la fiche, et ses limites</text>

  <rect x="685" y="110" width="180" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="775" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">4 · Porter</text>
  <text x="775" y="164" text-anchor="middle" font-size="11.5" fill="#475569">une porte qui peut échouer</text>

  <line x1="222" y1="150" x2="253" y2="150" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="437" y1="150" x2="468" y2="150" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="652" y1="150" x2="683" y2="150" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>

  <path d="M775,192 C775,260 450,280 130,240 C110,235 105,222 106,200" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#f)"/>
  <text x="450" y="292" text-anchor="middle" font-size="12.5" fill="#475569">la porte rejoue le chiffre : si elle ne peut plus échouer, elle ne mesure plus rien.</text>

  <rect x="40" y="320" width="825" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="452" y="344" text-anchor="middle" font-size="12.5" fill="#334155">Les cinq pièges : la position avec elle-même · le ridge sous-déterminé · le plan hors corpus ·</text>
  <text x="452" y="364" text-anchor="middle" font-size="12.5" fill="#334155">les couches ignorées · le λ fixé. Le remède est toujours le même : écrire le piège à côté du chiffre.</text>
</svg>
