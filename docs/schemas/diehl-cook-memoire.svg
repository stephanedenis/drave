<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="DejaVu Sans, Arial, sans-serif">
<title>La mémoire N2 : des prototypes de sens, pas des pixels</title>
<desc>Un corpus de RSN, un encodeur φ qui ne lit que le corps, un D&amp;C qui mémorise des prototypes, un graphe de prototypes et une annotation de récupération.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="500" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">La mémoire N2 : des prototypes de sens, pas des pixels</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">N2 reconnaît, rapproche et complète ; il n&#x27;infère pas — c&#x27;est le travail de N3.</text>
<rect x="30" y="100" width="150" height="92" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="105.0" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">corpus RSN</text>
<text x="105.0" y="146.0" text-anchor="middle" font-size="9.5" fill="#334155">corps canoniques</text>
<text x="105.0" y="159.775" text-anchor="middle" font-size="9.5" fill="#334155">annotations</text>
<rect x="210" y="100" width="100" height="92" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="260.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#6d28d9">φ</text>
<text x="260.0" y="146.0" text-anchor="middle" font-size="9" fill="#334155">corps seul</text>
<text x="260.0" y="159.05" text-anchor="middle" font-size="9" fill="#334155">dim. déclarée</text>
<rect x="340" y="100" width="170" height="92" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="425.0" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">D&amp;C mémoire</text>
<text x="425.0" y="146.0" text-anchor="middle" font-size="9.5" fill="#334155">n_e prototypes</text>
<text x="425.0" y="159.775" text-anchor="middle" font-size="9.5" fill="#334155">dans φ-espace</text>
<rect x="540" y="100" width="170" height="92" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="625.0" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">graphe</text>
<text x="625.0" y="146.0" text-anchor="middle" font-size="9.5" fill="#334155">co-activation</text>
<text x="625.0" y="159.775" text-anchor="middle" font-size="9.5" fill="#334155">distance</text>
<rect x="740" y="100" width="190" height="92" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="835.0" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">RSN annotée</text>
<text x="835.0" y="146.0" text-anchor="middle" font-size="9.5" fill="#334155">prototype, distance</text>
<text x="835.0" y="159.775" text-anchor="middle" font-size="9.5" fill="#334155">confiance_pm</text>
<line x1="180" y1="146" x2="208" y2="146" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<line x1="310" y1="146" x2="338" y2="146" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<line x1="510" y1="146" x2="538" y2="146" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<line x1="710" y1="146" x2="738" y2="146" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<text x="480" y="218" text-anchor="middle" font-size="9.5" fill="#475569">φ ne lit que le corps ; l&#x27;annotation est un port séparé</text>
<rect x="30" y="270" width="214" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="137" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">récupération</text>
<text x="137" y="316" text-anchor="middle" font-size="9.5" fill="#334155">RSN bruitée → bon prototype</text>
<text x="137" y="338" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">top-1, top-5</text>
<rect x="260" y="270" width="214" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="367" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">invariance</text>
<text x="367" y="316" text-anchor="middle" font-size="9.5" fill="#334155">même corps, autre annotation</text>
<text x="367" y="338" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">accord du prototype</text>
<rect x="490" y="270" width="214" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="597" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">open-set</text>
<text x="597" y="316" text-anchor="middle" font-size="9.5" fill="#334155">RSN inconnue → distance haute</text>
<text x="597" y="338" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">AUC</text>
<rect x="720" y="270" width="214" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="827" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">complétion</text>
<text x="827" y="316" text-anchor="middle" font-size="9.5" fill="#334155">champ manquant → prototype</text>
<text x="827" y="338" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">exactitude</text>
<rect x="30" y="390" width="900" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="417" text-anchor="middle" font-size="10.5" fill="#334155">Une mémoire de prototypes n&#x27;infère pas : elle reconnaît. La composition et la déduction sont N3.</text>
</svg>
