<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Le protocole sémantique : surface, encodeur, z, décodeur, surface</title>
  <desc>Deux étages : rejouer le même article dans plusieurs langues pour faire converger z, puis décoder z avec la langue cible.</desc>
  <defs>
    <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
  </defs>
  <rect width="900" height="430" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Le protocole sémantique : trois étages</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#475569">On rejoue le même sens dans plusieurs langues jusqu'à ce que z converge, puis on décode.</text>

  <rect x="25" y="110" width="140" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="95" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">surface L1</text>
  <text x="95" y="160" text-anchor="middle" font-size="11" fill="#475569">l'article source</text>
  <rect x="205" y="110" width="140" height="66" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="275" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">encodeur</text>
  <text x="275" y="160" text-anchor="middle" font-size="11" fill="#475569">route, mean pooling</text>
  <rect x="385" y="110" width="110" height="66" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">z</text>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#475569">128 dims, normalisé</text>
  <rect x="535" y="110" width="180" height="66" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="625" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">décodeur + langue L2</text>
  <text x="625" y="160" text-anchor="middle" font-size="11" fill="#475569">la langue est ici, pas dans z</text>
  <rect x="755" y="110" width="120" height="66" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="815" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">surface L2</text>
  <text x="815" y="160" text-anchor="middle" font-size="11" fill="#475569">le texte rendu</text>

  <line x1="167" y1="143" x2="203" y2="143" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="347" y1="143" x2="383" y2="143" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="497" y1="143" x2="533" y2="143" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="717" y1="143" x2="753" y2="143" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>

  <path d="M275,180 C275,230 440,230 440,180" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <text x="357" y="244" text-anchor="middle" font-size="11.5" fill="#b45309">même article, autre langue</text>
  <line x1="625" y1="180" x2="440" y2="180" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <text x="545" y="204" text-anchor="middle" font-size="11.5" fill="#b45309">même z, autre langue</text>

  <rect x="205" y="300" width="290" height="70" rx="10" fill="#e2e8f0" stroke="#334155"/>
  <text x="350" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Étage 1 — rejouer et converger</text>
  <text x="350" y="348" text-anchor="middle" font-size="11.5" fill="#475569">UDHR, 10 langues, rappel parallèle 0,426</text>
  <rect x="535" y="300" width="340" height="70" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="705" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Étage 2 — parler</text>
  <text x="705" y="348" text-anchor="middle" font-size="11.5" fill="#475569">décodeur négatif : 14,0 / 5,4 contre 38,8</text>

  <text x="450" y="408" text-anchor="middle" font-size="12" fill="#475569">Le raisonnement sur z n'est branché qu'après un décodeur au-dessus du plancher.</text>
</svg>
