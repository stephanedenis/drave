<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="DejaVu Sans, Arial, sans-serif">
<title>La bonne granularité : petit, mais pas trop</title>
<desc>Un bloc trop gros n&#x27;est pas substituable ; un bloc trop petit paie la liaison. L&#x27;optimum se mesure.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="570" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">La bonne granularité : petit, mais pas trop</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">La modularité extrême a un prix : chaque arête paie une liaison. On découpe, puis on remesure.</text>
<rect x="30" y="100" width="430" height="250" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="245" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">monolithe</text>
<rect x="80" y="150" width="330" height="120" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
<text x="245" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">un seul bloc</text>
<text x="245" y="210" text-anchor="middle" font-size="10.5" fill="#7f1d1d">contrat flou</text>
<text x="245" y="230" text-anchor="middle" font-size="10.5" fill="#7f1d1d">coût non mesurable</text>
<text x="245" y="250" text-anchor="middle" font-size="10.5" fill="#7f1d1d">non plaçable, non substituable</text>
<text x="245" y="330" text-anchor="middle" font-size="9.5" font-style="italic" fill="#7f1d1d">une seule technologie, un seul rythme</text>
<rect x="500" y="100" width="430" height="250" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
<text x="715" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">graphe de petits blocs</text>
<rect x="540" y="155" width="80" height="55" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="580.0" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">N1</text>
<rect x="650" y="155" width="80" height="55" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="690.0" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">N1</text>
<rect x="760" y="155" width="80" height="55" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="800.0" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">N2</text>
<rect x="540" y="245" width="80" height="55" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="580.0" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">N2</text>
<rect x="650" y="245" width="80" height="55" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="690.0" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">N3</text>
<rect x="760" y="245" width="80" height="55" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="800.0" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">N3</text>
<line x1="620" y1="182" x2="648" y2="182" stroke="#334155" stroke-width="1.3" marker-end="url(#f)"/>
<line x1="730" y1="182" x2="758" y2="182" stroke="#334155" stroke-width="1.3" marker-end="url(#f)"/>
<line x1="580" y1="210" x2="580" y2="243" stroke="#334155" stroke-width="1.3" marker-end="url(#f)"/>
<line x1="690" y1="210" x2="690" y2="243" stroke="#334155" stroke-width="1.3" marker-end="url(#f)"/>
<line x1="800" y1="210" x2="800" y2="243" stroke="#334155" stroke-width="1.3" marker-end="url(#f)"/>
<line x1="620" y1="272" x2="648" y2="272" stroke="#334155" stroke-width="1.3" marker-end="url(#f)"/>
<text x="715" y="330" text-anchor="middle" font-size="9.5" font-style="italic" fill="#15803d">ports typés, coût mesurable, plaçable, remplaçable</text>
<rect x="30" y="380" width="900" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<line x1="80" y1="480" x2="880" y2="480" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="80" y1="400" x2="80" y2="490" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M90,410 C220,455 320,470 470,470 C620,470 730,455 870,412" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#f)"/>
<text x="180" y="500" text-anchor="middle" font-size="9" fill="#475569">trop petit : la liaison domine</text>
<text x="480" y="500" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#15803d">optimum</text>
<text x="780" y="500" text-anchor="middle" font-size="9" fill="#475569">trop gros : la substitution meurt</text>
<text x="480" y="394" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#475569">coût total</text>
<text x="480" y="545" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">coût_total = coût_bloc + k · nombre_d_arêtes</text>
</svg>
