<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="DejaVu Sans, Arial, sans-serif">
<title>Le contrat de ports : ce qui entre, ce qui sort</title>
<desc>Une RSN entre, un vecteur canonique φ(RSN) alimente le bloc, une RSN annotée sort ; le chargeur refuse une arête surface → niveau 2.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="540" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Le contrat de ports : ce qui entre, ce qui sort</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Le bloc ne voit jamais la surface : il voit φ(RSN), et il rend une RSN annotée.</text>
<rect x="30" y="96" width="180" height="180" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="120.0" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">RSN</text>
<text x="120.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#334155">corps canonique</text>
<text x="120.0" y="157.225" text-anchor="middle" font-size="10.5" fill="#334155">annotation</text>
<text x="120.0" y="172.45" text-anchor="middle" font-size="10.5" fill="#334155">empreinte</text>
<text x="120.0" y="187.675" text-anchor="middle" font-size="10.5" fill="#334155">hors annotation</text>
<rect x="240" y="130" width="130" height="110" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="305.0" y="154" text-anchor="middle" font-size="18" font-weight="bold" fill="#6d28d9">φ</text>
<text x="305.0" y="176.0" text-anchor="middle" font-size="10" fill="#334155">RSN → vecteur</text>
<text x="305.0" y="190.5" text-anchor="middle" font-size="10" fill="#334155">canonique</text>
<text x="305.0" y="205.0" text-anchor="middle" font-size="10" fill="#334155">dimensions</text>
<text x="305.0" y="219.5" text-anchor="middle" font-size="10" fill="#334155">déclarées</text>
<rect x="400" y="96" width="220" height="200" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="510" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">spiking_map</text>
<text x="510" y="140" text-anchor="middle" font-size="10.5" fill="#475569">niveau 2 · D&amp;C</text>
<rect x="420" y="154" width="80" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="460.0" y="170.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b45309">in · rsn</text>
<rect x="520" y="154" width="80" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="560.0" y="170.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b45309">out · rsn</text>
<text x="510" y="200" text-anchor="middle" font-size="10.5" fill="#334155">état v, traces</text>
<text x="510" y="218" text-anchor="middle" font-size="10.5" fill="#334155">poids appris</text>
<text x="510" y="236" text-anchor="middle" font-size="10.5" fill="#334155">θ adaptatif</text>
<rect x="430" y="256" width="160" height="24" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="510.0" y="272.0" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">trace · rejouable</text>
<rect x="650" y="96" width="280" height="180" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="790.0" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">RSN annotée</text>
<text x="790.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#334155">corps : glyphe 7</text>
<text x="790.0" y="157.225" text-anchor="middle" font-size="10.5" fill="#334155">annotation : confiance_pm</text>
<text x="790.0" y="172.45" text-anchor="middle" font-size="10.5" fill="#334155">format, surface, lecture</text>
<text x="790.0" y="187.675" text-anchor="middle" font-size="10.5" fill="#334155">empreinte inchangée</text>
<line x1="211" y1="186" x2="238" y2="186" stroke="#334155" stroke-width="2.2" marker-end="url(#fa)"/>
<line x1="371" y1="186" x2="398" y2="186" stroke="#334155" stroke-width="2.2" marker-end="url(#f)"/>
<line x1="621" y1="186" x2="648" y2="186" stroke="#334155" stroke-width="2.2" marker-end="url(#fa)"/>
<text x="405" y="312" text-anchor="start" font-size="10.5" fill="#6d28d9">φ(RSN) est le seul canal d&#x27;entrée</text>
<rect x="30" y="330" width="450" height="180" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
<text x="255" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">Anatomie de la RSN</text>
<text x="50" y="386" text-anchor="start" font-size="12" font-weight="bold" fill="#0f172a">corps</text>
<text x="50" y="406" text-anchor="start" font-size="10.5" fill="#334155">canonique, sans flottant, empreinte = hash(corps)</text>
<text x="50" y="434" text-anchor="start" font-size="12" font-weight="bold" fill="#0f172a">annotation</text>
<text x="50" y="454" text-anchor="start" font-size="10.5" fill="#334155">confiance, ambiguïtés, format, langue, surface</text>
<text x="50" y="482" text-anchor="start" font-size="10.5" font-style="italic" fill="#475569">hors empreinte : le bruit est transporté, pas confondu</text>
<rect x="500" y="330" width="430" height="180" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="715" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Ce que le chargeur refuse</text>
<text x="522" y="388" text-anchor="start" font-size="13" font-weight="bold" fill="#b91c1c">×</text>
<text x="542" y="388" text-anchor="start" font-size="11" fill="#7f1d1d">surface → bloc de niveau ≥ 2</text>
<text x="522" y="416" text-anchor="start" font-size="13" font-weight="bold" fill="#b91c1c">×</text>
<text x="542" y="416" text-anchor="start" font-size="11" fill="#7f1d1d">N1 → N3 sans port RSN</text>
<text x="522" y="444" text-anchor="start" font-size="13" font-weight="bold" fill="#b91c1c">×</text>
<text x="542" y="444" text-anchor="start" font-size="11" fill="#7f1d1d">un bloc de kind inconnu</text>
<text x="522" y="472" text-anchor="start" font-size="13" font-weight="bold" fill="#b91c1c">×</text>
<text x="542" y="472" text-anchor="start" font-size="11" fill="#7f1d1d">une version DRVM inconnue</text>
<text x="715" y="500" text-anchor="middle" font-size="10.5" font-style="italic" fill="#7f1d1d">refuser est une fonctionnalité, pas un échec</text>
</svg>
