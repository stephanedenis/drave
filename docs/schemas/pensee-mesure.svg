<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="DejaVu Sans, Arial, sans-serif">
<title>La mesure de la pensée</title>
<desc>On ne mesure pas seulement la réponse : on mesure la recherche, le coût, le regret et la justification.</desc>
