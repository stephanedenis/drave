<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="DejaVu Sans, Arial, sans-serif">
<title>Les portes du natif : N0 → N4</title>
<desc>Cinq portes, chacune avec une question, un critère et un contrôle négatif.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="420" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Les portes du natif : N0 → N4</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Une porte rouge n&#x27;est pas un échec : c&#x27;est une information qui nomme ce qui manque.</text>
<rect x="20" y="92" width="170" height="250" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="105" y="122" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">N0</text>
<text x="105" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">le format</text>
<text x="32" y="180" text-anchor="start" font-size="12" font-weight="bold" fill="#1d4ed8">•</text>
<text x="44" y="180" text-anchor="start" font-size="10.5" fill="#475569">DRVM se lit ?</text>
<text x="32" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#1d4ed8">•</text>
<text x="44" y="224" text-anchor="start" font-size="10.5" fill="#475569">le moteur le charge ?</text>
<text x="32" y="268" text-anchor="start" font-size="12" font-weight="bold" fill="#1d4ed8">•</text>
<text x="44" y="268" text-anchor="start" font-size="10.5" fill="#475569">GGUF importable ?</text>
<line x1="191" y1="217" x2="204" y2="217" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
<rect x="206" y="92" width="170" height="250" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
<text x="291" y="122" text-anchor="middle" font-size="22" font-weight="bold" fill="#15803d">N1</text>
<text x="291" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">le modèle</text>
<text x="218" y="180" text-anchor="start" font-size="12" font-weight="bold" fill="#15803d">•</text>
<text x="230" y="180" text-anchor="start" font-size="10.5" fill="#475569">entraîneur = moteur ?</text>
<text x="218" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#15803d">•</text>
<text x="230" y="224" text-anchor="start" font-size="10.5" fill="#475569">le réflexe paie ?</text>
<text x="218" y="268" text-anchor="start" font-size="12" font-weight="bold" fill="#15803d">•</text>
<text x="230" y="268" text-anchor="start" font-size="10.5" fill="#475569">la pensée contracte ?</text>
<line x1="377" y1="217" x2="390" y2="217" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
<rect x="392" y="92" width="170" height="250" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<text x="477" y="122" text-anchor="middle" font-size="22" font-weight="bold" fill="#b45309">N2</text>
<text x="477" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">la distillation</text>
<text x="404" y="180" text-anchor="start" font-size="12" font-weight="bold" fill="#b45309">•</text>
<text x="416" y="180" text-anchor="start" font-size="10.5" fill="#475569">écart au professeur</text>
<text x="404" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#b45309">•</text>
<text x="416" y="224" text-anchor="start" font-size="10.5" fill="#475569">les langues tiennent</text>
<line x1="563" y1="217" x2="576" y2="217" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
<rect x="578" y="92" width="170" height="250" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="663" y="122" text-anchor="middle" font-size="22" font-weight="bold" fill="#6d28d9">N3</text>
<text x="663" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">les opérations</text>
<text x="590" y="180" text-anchor="start" font-size="12" font-weight="bold" fill="#6d28d9">•</text>
<text x="602" y="180" text-anchor="start" font-size="10.5" fill="#475569">la sparsité paie</text>
<text x="590" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#6d28d9">•</text>
<text x="602" y="224" text-anchor="start" font-size="10.5" fill="#475569">le rejeu est exact</text>
<line x1="749" y1="217" x2="762" y2="217" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
<rect x="764" y="92" width="170" height="250" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<text x="849" y="122" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">N4</text>
<text x="849" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">l&#x27;usage</text>
<text x="776" y="180" text-anchor="start" font-size="12" font-weight="bold" fill="#334155">•</text>
<text x="788" y="180" text-anchor="start" font-size="10.5" fill="#475569">le chat est utilisable</text>
<text x="776" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#334155">•</text>
<text x="788" y="224" text-anchor="start" font-size="10.5" fill="#475569">consigne, arrêt, tours</text>
<rect x="30" y="362" width="900" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="386" text-anchor="middle" font-size="11.5" fill="#334155">Chaque porte se lit dans le registre par son code de sortie — jamais par un marqueur.</text>
</svg>
