<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="DejaVu Sans, Arial, sans-serif">
<title>L&#x27;arbre d&#x27;états : la mémoire de travail de la pensée</title>
<desc>Chaque nœud est un état pluriel ; chaque arête est un opérateur ; la frontière est ce qui reste à explorer.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="640" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">L&#x27;arbre d&#x27;états : la mémoire de travail de la pensée</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Le retour arrière est une arête de plus, pas un échec ; le meilleur nœud n&#x27;est pas toujours une feuille.</text>
<rect x="400" y="96" width="160" height="72" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="480.0" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">S0</text>
<text x="480.0" y="142.0" text-anchor="middle" font-size="9.5" fill="#334155">score 0,20</text>
<text x="480.0" y="155.775" text-anchor="middle" font-size="9.5" fill="#334155">frontière</text>
<rect x="120" y="210" width="160" height="72" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="200.0" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">S1</text>
<text x="200.0" y="256.0" text-anchor="middle" font-size="9.5" fill="#334155">score 0,45</text>
<text x="200.0" y="269.775" text-anchor="middle" font-size="9.5" fill="#334155">ouvert</text>
<line x1="480" y1="168" x2="200" y2="208" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
