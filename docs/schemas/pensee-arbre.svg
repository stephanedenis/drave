<text x="295.0" y="399.05" text-anchor="middle" font-size="9" fill="#334155">feuille</text>
<line x1="200" y1="282" x2="295" y2="338" stroke="#15803d" stroke-width="1.6" marker-end="url(#f)"/>
<rect x="400" y="340" width="150" height="72" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
