<text x="475.0" y="386.0" text-anchor="middle" font-size="9" fill="#334155">score 0,81</text>
<text x="475.0" y="399.05" text-anchor="middle" font-size="9" fill="#334155">feuille</text>
<line x1="480" y1="282" x2="475" y2="338" stroke="#15803d" stroke-width="1.6" marker-end="url(#f)"/>
