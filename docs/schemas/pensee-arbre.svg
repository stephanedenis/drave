<text x="115.0" y="386.0" text-anchor="middle" font-size="9" fill="#334155">score 0,52</text>
<text x="115.0" y="399.05" text-anchor="middle" font-size="9" fill="#334155">feuille</text>
<line x1="200" y1="282" x2="115" y2="338" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#f)"/>
