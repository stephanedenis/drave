<text x="655.0" y="386.0" text-anchor="middle" font-size="9" fill="#334155">score 0,30</text>
<text x="655.0" y="399.05" text-anchor="middle" font-size="9" fill="#334155">élagué</text>
<line x1="480" y1="282" x2="655" y2="338" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f)"/>
<rect x="740" y="340" width="150" height="72" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="815.0" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">S8</text>
<text x="815.0" y="386.0" text-anchor="middle" font-size="9" fill="#334155">score —</text>
<text x="815.0" y="399.05" text-anchor="middle" font-size="9" fill="#334155">élagué</text>
<line x1="760" y1="282" x2="815" y2="338" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f)"/>
<rect x="40" y="450" width="880" height="70" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
<text x="480" y="476" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">frontière = { S4, S5, S6 }   ·   meilleur = S6 (0,81)   ·   prochain = développer S6</text>
<text x="480" y="498" text-anchor="middle" font-size="9.5" fill="#475569">Un nœud garde son score, son coût, sa profondeur et son parent ; la frontière est un tas.</text>
<path d="M115,412 C115,430 650,430 655,412" fill="none" stroke="#6d28d9" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#f)"/>
<text x="385" y="442" text-anchor="middle" font-size="9" fill="#6d28d9">transposition : même empreinte, même sous-arbre mémoïsé</text>
<rect x="40" y="552" width="880" height="54" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="480" y="576" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Le score n&#x27;est pas la réponse : c&#x27;est une hypothèse de valeur. La réponse est le meilleur état settled.</text>
<text x="480" y="594" text-anchor="middle" font-size="9.5" fill="#475569">Un arbre sans trace n&#x27;est pas une pensée : c&#x27;est un nuage de nœuds.</text>
</svg>
