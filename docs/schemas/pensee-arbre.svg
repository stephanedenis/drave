<text x="480.0" y="256.0" text-anchor="middle" font-size="9.5" fill="#334155">score 0,38</text>
<text x="480.0" y="269.775" text-anchor="middle" font-size="9.5" fill="#334155">ouvert</text>
<line x1="480" y1="168" x2="480" y2="208" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<rect x="680" y="210" width="160" height="72" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="760.0" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">S3</text>
<text x="760.0" y="256.0" text-anchor="middle" font-size="9.5" fill="#334155">score 0,71</text>
<text x="760.0" y="269.775" text-anchor="middle" font-size="9.5" fill="#334155">ouvert</text>
<line x1="480" y1="168" x2="760" y2="208" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<rect x="40" y="340" width="150" height="72" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
