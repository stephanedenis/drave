<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Les modules cerveau-langage M1–M9 sur le bus</title>
  <desc>La surface entre par le hub M1, devient un code RSN typé, passe sur le bus, puis alimente M2 à M7 ; M4 alimente M8 (sommeil).</desc>
  <defs>
    <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
  </defs>
  <rect width="900" height="480" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Les modules cerveau-langage M1–M9 sur le bus</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#475569">Aucun module ne parle directement à un autre : ils publient et lisent des événements.</text>

  <rect x="25" y="190" width="130" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="90" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">surface</text>
  <text x="90" y="240" text-anchor="middle" font-size="11" fill="#475569">le texte, la notation</text>
  <rect x="190" y="190" width="140" height="64" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="260" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">M1 hub</text>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#475569">codec + contexte</text>
  <rect x="365" y="190" width="150" height="64" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="440" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">code RSN typé</text>
  <text x="440" y="240" text-anchor="middle" font-size="11" fill="#475569">sens publié + surface</text>
  <rect x="550" y="190" width="120" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="610" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">bus</text>
  <text x="610" y="240" text-anchor="middle" font-size="11" fill="#475569">événements typés</text>

  <line x1="157" y1="222" x2="188" y2="222" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="332" y1="222" x2="363" y2="222" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="517" y1="222" x2="548" y2="222" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>

  <line x1="610" y1="190" x2="610" y2="105" stroke="#334155" stroke-width="2"/>
  <line x1="610" y1="105" x2="700" y2="105" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
  <line x1="610" y1="222" x2="700" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
  <line x1="610" y1="222" x2="700" y2="215" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
  <line x1="610" y1="222" x2="700" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
  <line x1="610" y1="222" x2="700" y2="325" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
  <line x1="610" y1="222" x2="700" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>
  <line x1="610" y1="222" x2="700" y2="435" stroke="#334155" stroke-width="2" marker-end="url(#f)"/>

  <rect x="700" y="82" width="170" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="785" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">M2 voies</text>
  <rect x="700" y="137" width="170" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="785" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">M3 mémoire de travail</text>
  <rect x="700" y="192" width="170" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="785" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">M4 épisodique</text>
  <rect x="700" y="247" width="170" height="44" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="785" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">M8 sommeil</text>
  <rect x="700" y="302" width="170" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="785" y="329" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">M5 prédictif</text>
  <rect x="700" y="357" width="170" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="785" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">M6 gating</text>
  <rect x="700" y="412" width="170" height="44" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="785" y="439" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">M7 neuromodulation</text>

  <text x="450" y="468" text-anchor="middle" font-size="12" fill="#475569">Le hub M1 publie le sens et la surface ; les autres modules s'abonnent au bus.</text>
</svg>
