<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 720" width="1260" height="720" role="img">
<title>Les huit chantiers de Drave et leurs relations</title>
<desc>D (données) alimente L (bloc langue), N (natif), S (structures) et R (lecteur) ; L alimente S, B et N ; S alimente B et renvoie ses validations à L ; A (moteur) exécute N et B ; N porte R1–R3 ; B10.3 attend R5 ; B13 (pensée) consomme R, L et N. Trait plein : alimente ou débloque ; pointillé : attend ou plafonne.</desc>
<defs><marker id="pointe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#546e7a"/></marker></defs>
<rect width="1260" height="720" fill="#ffffff"/>
<text x="30" y="40" font-size="20" font-weight="bold" fill="#263238">Les huit chantiers et leurs relations</text>
<text x="30" y="64" font-size="12" fill="#546e7a">vue d’ensemble au 2026-11-01 · le détail des arêtes A/B/N/R est dans docs/pilotage/backlog/dependances.md</text>
<rect x="60" y="96" width="200" height="86" rx="8" fill="#eceff1" stroke="#37474f" stroke-width="2"/><text x="160.0" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#37474f">D — les données</text><text x="160.0" y="154" text-anchor="middle" font-size="11" fill="#444">10 corpus · 38,8 Go</text>
<rect x="340" y="96" width="200" height="86" rx="8" fill="#efebe9" stroke="#6d4c41" stroke-width="2"/><text x="440.0" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#6d4c41">L — le bloc langue</text><text x="440.0" y="154" text-anchor="middle" font-size="11" fill="#444">surface · heuristique + neuronal</text>
<rect x="620" y="96" width="200" height="86" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/><text x="720.0" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#00695c">S — les structures</text><text x="720.0" y="154" text-anchor="middle" font-size="11" fill="#444">candidats · validation humaine</text>
<rect x="900" y="96" width="200" height="86" rx="8" fill="#fdf3e3" stroke="#b26a00" stroke-width="2"/><text x="1000.0" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#b26a00">B — l'intelligence</text><text x="1000.0" y="154" text-anchor="middle" font-size="11" fill="#444">sens · jeux · B13</text>
<rect x="60" y="330" width="200" height="86" rx="8" fill="#eaf1fb" stroke="#24558f" stroke-width="2"/><text x="160.0" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#24558f">A — le moteur</text><text x="160.0" y="388" text-anchor="middle" font-size="11" fill="#444">flux typés · rejeu</text>
<rect x="340" y="330" width="200" height="86" rx="8" fill="#eaf5ea" stroke="#2e7d32" stroke-width="2"/><text x="440.0" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e7d32">N — le natif</text><text x="440.0" y="388" text-anchor="middle" font-size="11" fill="#444">DRVM · distillation</text>
<rect x="620" y="330" width="200" height="86" rx="8" fill="#f3e8f8" stroke="#6a1b9a" stroke-width="2"/><text x="720.0" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#6a1b9a">R — le lecteur</text><text x="720.0" y="388" text-anchor="middle" font-size="11" fill="#444">preuve d'usage · R0–R4</text>
<rect x="900" y="330" width="200" height="86" rx="8" fill="#fdecea" stroke="#b03a2e" stroke-width="2"/><text x="1000.0" y="364" text-anchor="middle" font-size="16" font-weight="bold" fill="#b03a2e">B13 — la pensée</text><text x="1000.0" y="388" text-anchor="middle" font-size="11" fill="#444">états pluriels · anytime</text>
<path d="M260,139 L340,139" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="275" y="132" font-size="10" fill="#37474f">corpus</text>
<path d="M540,139 L620,139" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="550" y="132" font-size="10" fill="#37474f">annotations</text>
<path d="M820,139 L900,139" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="830" y="132" font-size="10" fill="#37474f">pragmatique</text>
<path d="M260,373 L340,373" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="275" y="366" font-size="10" fill="#37474f">exécution</text>
<path d="M540,373 L620,373" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="550" y="366" font-size="10" fill="#37474f">R1–R3</text>
<path d="M900,373 L820,373" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="830" y="366" font-size="10" fill="#37474f">états</text>
<path d="M440,182 L440,330" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="446" y="256" font-size="10" fill="#37474f">surface (allège)</text>
<path d="M160,182 L160,250 L300,250 L300,373 L340,373" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="190" y="244" font-size="10" fill="#37474f">entraînement</text>
<path d="M160,96 L160,76 L720,76 L720,96" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="400" y="70" font-size="10" fill="#37474f">banque</text>
<path d="M440,96 L440,88 L860,88 L860,139 L900,139" fill="none" stroke="#546e7a" stroke-width="1.6" marker-end="url(#pointe)"/><text x="600" y="82" font-size="10" fill="#37474f">résidu ambigu</text>
<path d="M720,182 L720,250 L520,250 L520,182" fill="none" stroke="#546e7a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#pointe)"/><text x="600" y="244" font-size="10" fill="#37474f">validations</text>
<path d="M1000,182 L1000,250 L860,250 L860,373 L820,373" fill="none" stroke="#546e7a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#pointe)"/><text x="870" y="244" font-size="10" fill="#37474f">B10.3 → R5</text>
<path d="M160,416 L160,470 L880,470 L880,139 L900,139" fill="none" stroke="#546e7a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#pointe)"/><text x="500" y="464" font-size="10" fill="#37474f">blocs</text>
<path d="M1000,330 L1000,290 L460,290 L460,182" fill="none" stroke="#546e7a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#pointe)"/><text x="700" y="284" font-size="10" fill="#37474f">opérateurs</text>
<path d="M1000,416 L1000,480 L440,480 L440,416" fill="none" stroke="#546e7a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#pointe)"/><text x="700" y="474" font-size="10" fill="#37474f">opérateurs</text>
<rect x="60" y="520" width="520" height="150" rx="8" fill="#fafafa" stroke="#cfd8dc"/>
<text x="80" y="548" font-size="14" font-weight="bold" fill="#263238">Ressources partagées</text>
<text x="80" y="574" font-size="11" fill="#37474f">• R03 — le banc de lecture : tout le programme R se mesure par lui.</text>
<text x="80" y="596" font-size="11" fill="#37474f">• les corpus D — 10 langues, 21,6 M articles, splits, 0 fuite exacte.</text>
<text x="80" y="618" font-size="11" fill="#37474f">• le state store — State, Proposal, Score, Decision, Trace (B13, S, L).</text>
<text x="80" y="640" font-size="11" fill="#37474f">• les portes — 80 portes, dont la porte OCR-scans et la porte état.</text>
<rect x="620" y="520" width="580" height="150" rx="8" fill="#fafafa" stroke="#cfd8dc"/>
<text x="640" y="548" font-size="14" font-weight="bold" fill="#263238">Les trois chemins</text>
<text x="640" y="574" font-size="11" fill="#37474f">• du lecteur : R01 → R02 → R03 → R31 → R32 → R51 (profondeur 5).</text>
<text x="640" y="596" font-size="11" fill="#37474f">• de la langue : D → L → S → B (la surface, puis les interprétations, puis le sens).</text>
<text x="640" y="618" font-size="11" fill="#37474f">• du natif : D → N2 → R1 → R2 → R3 (corpus, modèle, fenêtre, mémoire, restitution).</text>
<text x="640" y="650" font-size="11" fill="#546e7a">Trait plein : alimente ou débloque. Pointillé : attend ou plafonne.</text>
</svg>