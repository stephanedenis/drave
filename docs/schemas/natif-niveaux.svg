<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="DejaVu Sans, Arial, sans-serif">
<title>Trois niveaux de contrat, un centre neutre</title>
<desc>N1 surface, N2 RSN au centre, N3 pensée : la surface ne traverse jamais le centre ; un bloc déclare son niveau par le type de ses ports.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="530" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Trois niveaux de contrat, un centre neutre</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">N1 surface → N2 RSN → N3 pensée : le sens est au centre, la surface aux bords.</text>
<rect x="24" y="130" width="150" height="190" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="99.0" y="154" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">surface</text>
<text x="99.0" y="176.0" text-anchor="middle" font-size="12" fill="#334155">texte</text>
<text x="99.0" y="193.4" text-anchor="middle" font-size="12" fill="#334155">image</text>
<text x="99.0" y="210.8" text-anchor="middle" font-size="12" fill="#334155">notation</text>
<text x="99.0" y="228.2" text-anchor="middle" font-size="12" fill="#334155">langue, style</text>
<text x="99.0" y="245.6" text-anchor="middle" font-size="12" fill="#334155">format</text>
<text x="99" y="340" text-anchor="middle" font-size="11.5" font-style="italic" fill="#1d4ed8">ce qui varie</text>
<rect x="205" y="100" width="220" height="250" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="315" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">N1 · surface</text>
<text x="315" y="146" text-anchor="middle" font-size="11.5" fill="#475569">propre à la langue</text>
<rect x="220" y="162" width="190" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="315.0" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">encodeur</text>
<text x="315.0" y="208.0" text-anchor="middle" font-size="11.5" fill="#334155">surface → RSN</text>
<text x="315.0" y="224.675" text-anchor="middle" font-size="11.5" fill="#334155">lit, normalise, type</text>
<rect x="220" y="250" width="190" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="315.0" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">décodeur</text>
<text x="315.0" y="296.0" text-anchor="middle" font-size="11.5" fill="#334155">RSN → surface</text>
<text x="315.0" y="312.675" text-anchor="middle" font-size="11.5" fill="#334155">rend, restitue</text>
<rect x="455" y="100" width="230" height="250" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
<text x="570" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">N2 · RSN — le centre</text>
<text x="570" y="146" text-anchor="middle" font-size="11.5" fill="#475569">neutre · typé · annoté</text>
<text x="570" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">unités de sens</text>
<text x="570" y="218" text-anchor="middle" font-size="12.5" fill="#334155">corps canonique</text>
<text x="570" y="242" text-anchor="middle" font-size="12.5" fill="#334155">annotation hors empreinte</text>
<text x="570" y="274" text-anchor="middle" font-size="11.5" fill="#475569">empreinte = hash(corps)</text>
<text x="570" y="300" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">aucun flottant dans le corps</text>
<text x="570" y="330" text-anchor="middle" font-size="11.5" fill="#b45309">le même sens, toutes surfaces</text>
<rect x="715" y="100" width="220" height="250" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
<text x="825" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">N3 · pensée</text>
<text x="825" y="146" text-anchor="middle" font-size="11.5" fill="#475569">opérations · composition</text>
<rect x="730" y="170" width="190" height="55" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="825.0" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">bloc classique</text>
<text x="825.0" y="216.0" text-anchor="middle" font-size="11" fill="#334155">règle, solveur, index</text>
<rect x="730" y="240" width="190" height="55" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="825.0" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">bloc neuronal</text>
<text x="825.0" y="286.0" text-anchor="middle" font-size="11" fill="#334155">représenter, proposer</text>
<text x="825" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">ne lit jamais la surface</text>
<line x1="176" y1="197" x2="217" y2="197" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#fb)"/>
<line x1="412" y1="197" x2="453" y2="197" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
<line x1="687" y1="197" x2="713" y2="197" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
<text x="434" y="187" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">RSN</text>
<text x="701" y="187" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">RSN</text>
<path d="M935,225 L946,225 L946,372 L332,372 L332,322" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#fb)"/>
<text x="500" y="390" text-anchor="middle" font-size="11.5" fill="#1d4ed8">retour : la RSN d&#x27;action redescend (miroir)</text>
<path d="M60,322 L60,432 L825,432 L825,352" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#fr)"/>
<text x="462" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">interdit : surface → pensée, le raccourci qui rend l&#x27;invariance invérifiable</text>
<rect x="24" y="478" width="912" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="502" text-anchor="middle" font-size="12" fill="#334155">étage 1 = N1 ↔ N2 (entrée-sortie)   ·   étage 2 = N3 (pensée)   ·   le niveau est un contrat de port, pas un algorithme</text>
</svg>
