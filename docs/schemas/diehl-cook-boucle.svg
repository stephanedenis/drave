<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="DejaVu Sans, Arial, sans-serif">
<title>La boucle d&#x27;entraînement et ses contrôles</title>
<desc>STDP sans étiquette, puis gel, puis assignation sur le train, puis test tenu à l&#x27;écart ; quatre contrôles négatifs tuent les fausses victoires.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="440" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">La boucle d&#x27;entraînement et ses contrôles</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">L&#x27;étiquette n&#x27;entre jamais dans l&#x27;apprentissage : elle nomme les neurones après le gel.</text>
<rect x="30" y="116" width="135" height="92" rx="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="50" cy="136" r="11" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="50" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">1</text>
<text x="68" y="141" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1d4ed8">corpus train</text>
<text x="42" y="170" text-anchor="start" font-size="9.5" fill="#334155">60 000 exemples</text>
<text x="42" y="188" text-anchor="start" font-size="9.5" fill="#475569">jamais le test</text>
<line x1="166" y1="162" x2="181" y2="162" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<rect x="183" y="116" width="135" height="92" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
<circle cx="203" cy="136" r="11" fill="#334155" stroke="#334155" stroke-width="1.8"/>
<text x="203" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">2</text>
<text x="221" y="141" text-anchor="start" font-size="11.5" font-weight="bold" fill="#0f172a">présentation</text>
<text x="195" y="170" text-anchor="start" font-size="9.5" fill="#334155">350 ms + 150 ms</text>
<text x="195" y="188" text-anchor="start" font-size="9.5" fill="#475569">Poisson, 1 000 pas</text>
<line x1="319" y1="162" x2="334" y2="162" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<rect x="336" y="116" width="135" height="92" rx="9" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
<circle cx="356" cy="136" r="11" fill="#15803d" stroke="#15803d" stroke-width="1.8"/>
<text x="356" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">3</text>
<text x="374" y="141" text-anchor="start" font-size="11.5" font-weight="bold" fill="#15803d">STDP</text>
<text x="348" y="170" text-anchor="start" font-size="9.5" fill="#334155">traces + normalisation</text>
<text x="348" y="188" text-anchor="start" font-size="9.5" fill="#475569">sans étiquette</text>
<line x1="472" y1="162" x2="487" y2="162" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<rect x="489" y="116" width="135" height="92" rx="9" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
<circle cx="509" cy="136" r="11" fill="#6d28d9" stroke="#6d28d9" stroke-width="1.8"/>
<text x="509" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">4</text>
<text x="527" y="141" text-anchor="start" font-size="11.5" font-weight="bold" fill="#6d28d9">gel</text>
<text x="501" y="170" text-anchor="start" font-size="9.5" fill="#334155">poids, θ, traces</text>
<text x="501" y="188" text-anchor="start" font-size="9.5" fill="#475569">plus de plasticité</text>
<line x1="625" y1="162" x2="640" y2="162" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<rect x="642" y="116" width="135" height="92" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<circle cx="662" cy="136" r="11" fill="#b45309" stroke="#b45309" stroke-width="1.8"/>
<text x="662" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">5</text>
<text x="680" y="141" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b45309">assignation</text>
<text x="654" y="170" text-anchor="start" font-size="9.5" fill="#334155">réponse moyenne</text>
<text x="654" y="188" text-anchor="start" font-size="9.5" fill="#475569">sur le TRAIN seul</text>
<line x1="778" y1="162" x2="793" y2="162" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<rect x="795" y="116" width="135" height="92" rx="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/>
<circle cx="815" cy="136" r="11" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="815" y="140" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#ffffff">6</text>
<text x="833" y="141" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1d4ed8">test</text>
<text x="807" y="170" text-anchor="start" font-size="9.5" fill="#334155">10 000 exemples</text>
<text x="807" y="188" text-anchor="start" font-size="9.5" fill="#475569">tenus à l&#x27;écart</text>
<path d="M890,116 L890,92 L95,92 L95,114" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f)"/>
<text x="492" y="84" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">exemple suivant</text>
<text x="480" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">Quatre contrôles négatifs, un par mécanisme</text>
<rect x="30" y="268" width="214" height="68" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
<text x="137" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">étiquettes permutées</text>
<text x="137" y="312" text-anchor="middle" font-size="9.5" fill="#7f1d1d">l&#x27;assignation doit tomber au hasard</text>
<text x="137" y="328" text-anchor="middle" font-size="9.2" fill="#7f1d1d">contrôle réussi = mécanisme inutile</text>
<rect x="260" y="268" width="214" height="68" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
<text x="367" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">inhibition coupée</text>
<text x="367" y="312" text-anchor="middle" font-size="9.5" fill="#7f1d1d">les prototypes doivent se confondre</text>
<text x="367" y="328" text-anchor="middle" font-size="9.2" fill="#7f1d1d">contrôle réussi = mécanisme inutile</text>
<rect x="490" y="268" width="214" height="68" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
<text x="597" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">homéostasie coupée</text>
<text x="597" y="312" text-anchor="middle" font-size="9.5" fill="#7f1d1d">quelques neurones doivent monopoliser</text>
<text x="597" y="328" text-anchor="middle" font-size="9.2" fill="#7f1d1d">contrôle réussi = mécanisme inutile</text>
<rect x="720" y="268" width="214" height="68" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
<text x="827" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">lecture taux seul</text>
<text x="827" y="312" text-anchor="middle" font-size="9.5" fill="#7f1d1d">le timing n&#x27;ajoute rien : le dire</text>
<text x="827" y="328" text-anchor="middle" font-size="9.2" fill="#7f1d1d">contrôle réussi = mécanisme inutile</text>
<rect x="30" y="360" width="900" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="383" text-anchor="middle" font-size="11.5" fill="#334155">Un contrôle négatif par mécanisme : si le contrôle réussit aussi bien, le mécanisme n&#x27;est pas nécessaire.</text>
<text x="480" y="402" text-anchor="middle" font-size="10" fill="#475569">L&#x27;assignation ne voit jamais le test ; le code de référence le rappelle : l&#x27;évaluer sur le test gonfle le score.</text>
</svg>
