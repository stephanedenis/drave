<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="DejaVu Sans, Arial, sans-serif">
<title>Du spike au fait : une seule trace pour apprendre, rejouer, mesurer</title>
<desc>dt = 0,5 ms ; 350 ms de présentation puis 150 ms de repos = 1 000 pas ; un spike devient un fait (couche, jeton, indice, valeur).</desc>
