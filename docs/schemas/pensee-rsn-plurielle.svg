<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="DejaVu Sans, Arial, sans-serif">
<title>La RSN est plurielle : un état, plusieurs candidats</title>
<desc>Le corps canonique est par candidat ; l&#x27;état est un ensemble ordonné, hashé, versionné. La RSN canonique unique est le résultat d&#x27;un cycle, pas la représentation de travail.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="620" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">La RSN est plurielle : un état, plusieurs candidats</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">L&#x27;état est la mémoire de travail ; le candidat est une hypothèse ; le corps est ce qui se compare.</text>
<rect x="30" y="96" width="260" height="400" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="160" y="124" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">État  S</text>
<text x="160" y="146" text-anchor="middle" font-size="9.5" fill="#475569">la mémoire de travail</text>
<text x="48" y="178" text-anchor="start" font-size="9.5" font-weight="bold" fill="#475569">parent</text>
<text x="48" y="195" text-anchor="start" font-size="10.5" fill="#0f172a">S⁻ (profondeur 2)</text>
<text x="48" y="220" text-anchor="start" font-size="9.5" font-weight="bold" fill="#475569">profondeur</text>
<text x="48" y="237" text-anchor="start" font-size="10.5" fill="#0f172a">3</text>
<text x="48" y="262" text-anchor="start" font-size="9.5" font-weight="bold" fill="#475569">budget</text>
<text x="48" y="279" text-anchor="start" font-size="10.5" fill="#0f172a">12 / 50 nœuds</text>
<text x="48" y="304" text-anchor="start" font-size="9.5" font-weight="bold" fill="#475569">candidats</text>
<text x="48" y="321" text-anchor="start" font-size="10.5" fill="#0f172a">4</text>
<text x="48" y="346" text-anchor="start" font-size="9.5" font-weight="bold" fill="#475569">statut</text>
<text x="48" y="363" text-anchor="start" font-size="10.5" fill="#0f172a">ouvert</text>
<text x="48" y="388" text-anchor="start" font-size="9.5" font-weight="bold" fill="#475569">empreinte</text>
<text x="48" y="405" text-anchor="start" font-size="10.5" fill="#0f172a">H(c1 ‖ c2 ‖ c3)</text>
<rect x="48" y="432" width="224" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="160" y="450" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#334155">l&#x27;état est versionné</text>
<text x="160" y="466" text-anchor="middle" font-size="8.8" fill="#475569">et se rejoue par son empreinte</text>
<rect x="320" y="96" width="610" height="86" rx="9" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="340" y="122" text-anchor="start" font-size="13" font-weight="bold" fill="#15803d">C1</text>
<text x="385" y="122" text-anchor="start" font-size="10.5" fill="#0f172a">corps : {glyphe: 7}</text>
<text x="340" y="144" text-anchor="start" font-size="9.5" fill="#475569">annotation : confiance 0,62 · provenance N1</text>
<rect x="790" y="108" width="120" height="22" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="850.0" y="123.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">hypothèse</text>
<text x="340" y="166" text-anchor="start" font-size="9" fill="#475569">coût : 3</text>
<text x="560" y="166" text-anchor="start" font-size="9" fill="#475569">empreinte : H(corps)</text>
<rect x="320" y="196" width="610" height="86" rx="9" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
<text x="340" y="222" text-anchor="start" font-size="13" font-weight="bold" fill="#b91c1c">C2</text>
<text x="385" y="222" text-anchor="start" font-size="10.5" fill="#0f172a">corps : {glyphe: 1}</text>
<text x="340" y="244" text-anchor="start" font-size="9.5" fill="#475569">annotation : confiance 0,21 · réfuté par contrainte</text>
<rect x="790" y="208" width="120" height="22" rx="11" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="850.0" y="223.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#b91c1c">réfuté</text>
<text x="340" y="266" text-anchor="start" font-size="9" fill="#475569">coût : 4</text>
<text x="560" y="266" text-anchor="start" font-size="9" fill="#475569">empreinte : H(corps)</text>
<rect x="320" y="296" width="610" height="86" rx="9" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="340" y="322" text-anchor="start" font-size="13" font-weight="bold" fill="#b45309">C3</text>
<text x="385" y="322" text-anchor="start" font-size="10.5" fill="#0f172a">corps : {glyphe: 7, contexte: prix}</text>
<text x="340" y="344" text-anchor="start" font-size="9.5" fill="#475569">annotation : confiance 0,14 · provenance N2</text>
<rect x="790" y="308" width="120" height="22" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="850.0" y="323.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#b45309">à évaluer</text>
<text x="340" y="366" text-anchor="start" font-size="9" fill="#475569">coût : 5</text>
<text x="560" y="366" text-anchor="start" font-size="9" fill="#475569">empreinte : H(corps)</text>
<rect x="320" y="396" width="610" height="86" rx="9" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="340" y="422" text-anchor="start" font-size="13" font-weight="bold" fill="#1d4ed8">C4</text>
<text x="385" y="422" text-anchor="start" font-size="10.5" fill="#0f172a">corps : {glyphe: null, ambiguïté: [7, 1]}</text>
<text x="340" y="444" text-anchor="start" font-size="9.5" fill="#475569">annotation : confiance 0,03 · N1 + N2</text>
<rect x="790" y="408" width="120" height="22" rx="11" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="850.0" y="423.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#1d4ed8">ouvert</text>
<text x="340" y="466" text-anchor="start" font-size="9" fill="#475569">coût : 6</text>
<text x="560" y="466" text-anchor="start" font-size="9" fill="#475569">empreinte : H(corps)</text>
<text x="480" y="528" text-anchor="middle" font-size="11" fill="#475569">L&#x27;ensemble est ordonné par score ; les candidats morts restent dans l&#x27;état comme traces.</text>
<rect x="30" y="556" width="900" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="583" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334155">La RSN de travail est un ensemble ; la RSN canonique unique est un résultat de cycle.</text>
</svg>
