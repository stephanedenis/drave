<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="DejaVu Sans, Arial, sans-serif">
<title>La mémoire et le rejeu de la pensée</title>
<desc>L&#x27;arbre est la mémoire épisodique : il se stocke, se requête, se compacte, se rejoue et se partage.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="560" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">La mémoire et le rejeu de la pensée</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Rejouer la pensée, c&#x27;est rejouer une séquence d&#x27;opérateurs et de décisions de stratégie.</text>
<rect x="30" y="100" width="230" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="145.0" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">arbre d&#x27;états</text>
<text x="145.0" y="146.0" text-anchor="middle" font-size="9.5" fill="#334155">nœuds, arêtes, scores</text>
<rect x="30" y="210" width="230" height="80" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="145.0" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">sous-arbre</text>
<text x="145.0" y="256.0" text-anchor="middle" font-size="9.5" fill="#334155">à compacter</text>
<line x1="145" y1="180" x2="145" y2="208" stroke="#b45309" stroke-width="1.6" marker-end="url(#f)"/>
<rect x="320" y="130" width="220" height="120" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="430.0" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d28d9">store</text>
<text x="430.0" y="176.0" text-anchor="middle" font-size="10" fill="#334155">empreinte, index</text>
<text x="430.0" y="190.5" text-anchor="middle" font-size="10" fill="#334155">version, partage</text>
<line x1="260" y1="150" x2="318" y2="170" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#f)"/>
<rect x="620" y="100" width="310" height="56" rx="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="636" y="122" text-anchor="start" font-size="11" font-weight="bold" fill="#1d4ed8">query</text>
<text x="636" y="140" text-anchor="start" font-size="8.8" fill="#475569">empreinte, contenu, statut</text>
<line x1="540" y1="190" x2="618" y2="128" stroke="#1d4ed8" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="620" y="170" width="310" height="56" rx="7" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
<text x="636" y="192" text-anchor="start" font-size="11" font-weight="bold" fill="#15803d">compact</text>
<text x="636" y="210" text-anchor="start" font-size="8.8" fill="#475569">résumé + justification</text>
<line x1="540" y1="190" x2="618" y2="198" stroke="#15803d" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="620" y="240" width="310" height="56" rx="7" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
<text x="636" y="262" text-anchor="start" font-size="11" font-weight="bold" fill="#b45309">replay</text>
<text x="636" y="280" text-anchor="start" font-size="8.8" fill="#475569">mêmes états, mêmes scores</text>
<line x1="540" y1="190" x2="618" y2="268" stroke="#b45309" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="620" y="310" width="310" height="56" rx="7" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
<text x="636" y="332" text-anchor="start" font-size="11" font-weight="bold" fill="#b91c1c">diff</text>
<text x="636" y="350" text-anchor="start" font-size="8.8" fill="#475569">premier nœud divergent</text>
<line x1="540" y1="190" x2="618" y2="338" stroke="#b91c1c" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="620" y="380" width="310" height="56" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="636" y="402" text-anchor="start" font-size="11" font-weight="bold" fill="#0f172a">share</text>
<text x="636" y="420" text-anchor="start" font-size="8.8" fill="#475569">sous-arbre + types + trace</text>
<line x1="540" y1="190" x2="618" y2="408" stroke="#334155" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="30" y="340" width="560" height="90" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="310" y="366" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">compacter, c&#x27;est garder la justification et le résumé, pas tous les nœuds.</text>
<text x="310" y="388" text-anchor="middle" font-size="9.5" fill="#475569">Un arbre qui ne se compacte pas finit par ne plus tenir en mémoire.</text>
<text x="310" y="410" text-anchor="middle" font-size="9.5" fill="#475569">Et un moteur qui ne tient pas en mémoire ne pense pas longtemps.</text>
<rect x="30" y="460" width="900" height="54" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
<text x="480" y="484" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0f172a">Le rejeu de la pensée n&#x27;est pas le rejeu d&#x27;un tenseur : c&#x27;est le rejeu d&#x27;une séquence de choix.</text>
<text x="480" y="502" text-anchor="middle" font-size="9.5" fill="#475569">La trace doit contenir les opérateurs et les décisions de stratégie, sinon le diff est aveugle.</text>
</svg>
