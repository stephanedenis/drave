<title>Diehl &amp; Cook (2015) : une mémoire compétitive à spikes</title>
<desc>Entrée Poisson, neurones LIF à conductance, STDP, inhibition latérale et seuil adaptatif : un apprentissage sans étiquette, une assignation de classes après coup.</desc>
