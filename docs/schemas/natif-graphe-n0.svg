<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="DejaVu Sans, Arial, sans-serif">
<title>drave-n0 : un graphe, pas une pile</title>
<desc>Six blocs de calcul (b0–b5), deux régions, trois têtes précoces, un pont et une cellule de pensée ; chaque bloc a des ports typés, un coût et une trace.</desc>
