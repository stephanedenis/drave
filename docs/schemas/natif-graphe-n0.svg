<text x="480" y="405" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">3 têtes précoces : le réflexe est entraîné avec le modèle, pas ajouté après</text>
<text x="480" y="430" text-anchor="middle" font-size="11.5" fill="#475569">Le pont tardif coûte 30× moins cher que le pont précoce (cible) : la place du pont est un choix de coût.</text>
<text x="480" y="452" text-anchor="middle" font-size="11" fill="#475569">Les experts sont choisis par le routeur (top-2) et le k-WTA garde 25 % des canaux : la sparsité est un budget, pas un espoir.</text>
<rect x="30" y="470" width="900" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="496" text-anchor="middle" font-size="11.5" fill="#334155">Un bloc = des entrées et sorties typées + un coût mesurable + une trace. Un bloc peut être neuronal ou classique ; le bus ne fait pas la différence.</text>
