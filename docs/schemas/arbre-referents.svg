<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 550" width="1020" height="550" role="img">
<title>Arbre syntaxique et liens référents-référés</title><desc>L&#x27;arbre d&#x27;une phrase d&#x27;Alice : le GV racine, les GN, GP, REL et SUB par profondeur, et les flèches pointillées des pronoms vers Alice, l&#x27;antécédent du contexte.</desc>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6672"/></marker><marker id="fleche-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<style>text{font-family:"DejaVu Sans",sans-serif;fill:#1d2733}.t{font-size:12px;font-weight:600}.s{font-size:10px;fill:#5a6672}rect{stroke:#2c3e50;stroke-width:1.5}.gn rect{fill:#e8f1fb}.gv rect{fill:#e9f7ee}.gp rect{fill:#fff4e2}.rel rect{fill:#f3e9fb}.sub rect{fill:#fdeaea}.arete{fill:none;stroke:#5a6672;stroke-width:1.7;marker-end:url(#fleche)}.ref{fill:none;stroke:#c0392b;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#fleche-ref)}.ctx rect{fill:#fdf6d8;stroke-dasharray:5 4}.jeton rect{fill:#fff;stroke:#c0392b}.lab{font-size:10px;fill:#c0392b;font-style:italic}</style>
<text x="40" y="30" class="t">Phrase : Elle avait pour habitude de se donner de très-bons conseils (bien qu&#x27;elle les suivît rarement), et quelquefoi…</text>
<text x="40" y="516.0" class="s">Contexte : Allons, à quoi bon pleurer ainsi, se dit Alice vivement.</text>
<path class="arete" d="M350.0,112.0 C350.0,142.0 135.0,146.0 135.0,176.0"/>
<path class="arete" d="M350.0,112.0 C350.0,142.0 350.0,146.0 350.0,176.0"/>
<path class="arete" d="M350.0,224.0 C350.0,254.0 242.5,258.0 242.5,288.0"/>
<path class="arete" d="M242.5,336.0 C242.5,366.0 350.0,370.0 350.0,400.0"/>
<path class="arete" d="M350.0,112.0 C350.0,142.0 565.0,146.0 565.0,176.0"/>
<path class="arete" d="M565.0,224.0 C565.0,254.0 457.5,258.0 457.5,288.0"/>
<g class="gv"><rect x="255.0" y="64.0" width="190" height="48" rx="9"/><text x="350.0" y="85.0" text-anchor="middle" class="t">Elle avait</text><text x="350.0" y="102.0" text-anchor="middle" class="s">GV · predicat</text></g>
<g class="gp"><rect x="40.0" y="176.0" width="190" height="48" rx="9"/><text x="135.0" y="197.0" text-anchor="middle" class="t">pour habitude</text><text x="135.0" y="214.0" text-anchor="middle" class="s">GP · but</text></g>
<g class="gv"><rect x="255.0" y="176.0" width="190" height="48" rx="9"/><text x="350.0" y="197.0" text-anchor="middle" class="t">se donner</text><text x="350.0" y="214.0" text-anchor="middle" class="s">GV · predicat</text></g>
<g class="gp"><rect x="147.5" y="288.0" width="190" height="48" rx="9"/><text x="242.5" y="309.0" text-anchor="middle" class="t">de très-bons conseils</text><text x="242.5" y="326.0" text-anchor="middle" class="s">GP · theme</text></g>
<g class="sub"><rect x="255.0" y="400.0" width="190" height="48" rx="9"/><text x="350.0" y="421.0" text-anchor="middle" class="t">bien qu&#x27;elle les suivît rarem…</text><text x="350.0" y="438.0" text-anchor="middle" class="s">SUB · concession</text></g>
<g class="gv"><rect x="470.0" y="176.0" width="190" height="48" rx="9"/><text x="565.0" y="197.0" text-anchor="middle" class="t">quelquefois elle se grondait</text><text x="565.0" y="214.0" text-anchor="middle" class="s">GV · predicat</text></g>
<g class="sub"><rect x="362.5" y="288.0" width="190" height="48" rx="9"/><text x="457.5" y="309.0" text-anchor="middle" class="t">si fort que les larmes lui en…</text><text x="457.5" y="326.0" text-anchor="middle" class="s">SUB · hypothese</text></g>
<g class="ctx"><rect x="778.0" y="54.0" width="170" height="50" rx="9"/><text x="863.0" y="75.0" text-anchor="middle" class="t">Alice</text><text x="863.0" y="92.0" text-anchor="middle" class="s">contexte</text></g>
<g class="jeton"><rect x="455.0" y="73.0" width="78" height="28" rx="7"/><text x="494.0" y="92.0" text-anchor="middle" class="t">Elle</text></g>
<path class="ref" d="M533.0,87.0 C615.0,87.0 708.0,79.0 778.0,79.0"/>
<text x="494.0" y="115.0" text-anchor="middle" class="lab">Elle → Alice</text>
<g class="jeton"><rect x="670.0" y="185.0" width="78" height="28" rx="7"/><text x="709.0" y="204.0" text-anchor="middle" class="t">elle</text></g>
<path class="ref" d="M748.0,199.0 C830.0,199.0 708.0,79.0 778.0,79.0"/>
<text x="709.0" y="227.0" text-anchor="middle" class="lab">elle → Alice</text>
<g class="jeton"><rect x="562.5" y="297.0" width="78" height="28" rx="7"/><text x="601.5" y="316.0" text-anchor="middle" class="t">lui</text></g>
<path class="ref" d="M640.5,311.0 C722.5,311.0 708.0,79.0 778.0,79.0"/>
<text x="601.5" y="339.0" text-anchor="middle" class="lab">lui → Alice</text>
</svg>
