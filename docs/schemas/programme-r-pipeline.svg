<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="DejaVu Sans, Arial, sans-serif">
<title>Le pipeline R0.6 — de la question à la réponse citée</title>
<desc>Un document, une question, un budget : une réponse avec sa source, ou un refus motivé.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="560" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Le pipeline R0.6 — de la question à la réponse citée</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Le budget se paie en octets ; la réponse porte sa région, son offset et son sha.</text>
<rect x="30" y="92" width="140" height="66" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="100.0" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">document</text>
<text x="100.0" y="138.0" text-anchor="middle" font-size="8.5" fill="#334155">octets</text>
<rect x="200" y="92" width="150" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="275.0" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">R0.1 · régions</text>
<text x="275.0" y="138.0" text-anchor="middle" font-size="8.5" fill="#334155">titres, tableaux</text>
<text x="275.0" y="150.325" text-anchor="middle" font-size="8.5" fill="#334155">code, offsets</text>
<rect x="380" y="92" width="170" height="66" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="465.0" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">R0.2 · contrôleur</text>
<text x="465.0" y="138.0" text-anchor="middle" font-size="8.5" fill="#334155">survol, balayage</text>
<text x="465.0" y="150.325" text-anchor="middle" font-size="8.5" fill="#334155">budget</text>
<rect x="580" y="92" width="150" height="66" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="655.0" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">passages</text>
<text x="655.0" y="138.0" text-anchor="middle" font-size="8.5" fill="#334155">BM25 + offsets</text>
<rect x="30" y="202" width="140" height="60" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="100.0" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">question</text>
<text x="100.0" y="248.0" text-anchor="middle" font-size="8.5" fill="#334155">mots, valeur</text>
<rect x="210" y="202" width="160" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="290.0" y="226" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">extractif</text>
<text x="290.0" y="248.0" text-anchor="middle" font-size="8.5" fill="#334155">le passage répond</text>
<rect x="390" y="202" width="160" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="470.0" y="226" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">span</text>
<text x="470.0" y="248.0" text-anchor="middle" font-size="8.5" fill="#334155">la valeur répond</text>
<rect x="570" y="202" width="180" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="660.0" y="226" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">modèle / cascade</text>
<text x="660.0" y="248.0" text-anchor="middle" font-size="8.5" fill="#334155">si la confiance</text>
<rect x="780" y="202" width="150" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="855.0" y="226" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">réponse</text>
<text x="855.0" y="248.0" text-anchor="middle" font-size="8.5" fill="#334155">citation + sha</text>
<rect x="390" y="310" width="160" height="60" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="470.0" y="334" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">refus</text>
<text x="470.0" y="356.0" text-anchor="middle" font-size="8.5" fill="#334155">score &lt; seuil</text>
<line x1="170" y1="125" x2="198" y2="125" stroke="#334155" stroke-width="1.6" marker-end="url(#f)"/>
<line x1="350" y1="125" x2="378" y2="125" stroke="#334155" stroke-width="1.6" marker-end="url(#f)"/>
<line x1="550" y1="125" x2="578" y2="125" stroke="#334155" stroke-width="1.6" marker-end="url(#f)"/>
<line x1="170" y1="232" x2="378" y2="232" stroke="#334155" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#f)"/>
<line x1="655" y1="158" x2="655" y2="200" stroke="#334155" stroke-width="1.6" marker-end="url(#f)"/>
<line x1="370" y1="232" x2="388" y2="232" stroke="#15803d" stroke-width="1.4" marker-end="url(#f)"/>
<line x1="550" y1="232" x2="568" y2="232" stroke="#b45309" stroke-width="1.4" marker-end="url(#f)"/>
<line x1="750" y1="232" x2="778" y2="232" stroke="#15803d" stroke-width="1.4" marker-end="url(#f)"/>
<line x1="470" y1="262" x2="470" y2="308" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#f)"/>
<text x="600" y="286" text-anchor="middle" font-size="8.5" fill="#475569">la confiance calibrée choisit</text>
<text x="600" y="300" text-anchor="middle" font-size="8.5" fill="#475569">la voie ; le seuil est daté</text>
<rect x="30" y="402" width="900" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="428" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">budget en octets · trace rejouable · calibration datée · provenance vérifiable · rejeu identique</text>
<rect x="30" y="470" width="900" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
<text x="480" y="496" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">le même lecteur sur le natif et sur le scan : la parité juge, pas le WER</text>
<text x="480" y="540" text-anchor="middle" font-size="9" font-style="italic" fill="#475569">R0.4 et R0.5 ont montré qu&#x27;une tête apprise et un seuil global ne suffisent pas : la politique se calibre par corpus.</text>
</svg>
