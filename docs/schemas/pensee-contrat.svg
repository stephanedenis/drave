<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="DejaVu Sans, Arial, sans-serif">
<title>Le contrat de la pensée</title>
<desc>Des types explicites, un moteur N3, des opérateurs N1/N2, un store d&#x27;arbres : le bus ne transporte que des états et des propositions.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="560" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Le contrat de la pensée</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Le moteur ne lit jamais la surface : il lit des états ; il n&#x27;écrit jamais une réponse sans justification.</text>
<rect x="360" y="190" width="240" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.2"/>
<text x="480" y="218" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0f172a">moteur de pensée</text>
<text x="480" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">N3 · state → state</text>
<text x="480" y="262" text-anchor="middle" font-size="10.5" fill="#b45309">ou state → decision</text>
<text x="480" y="290" text-anchor="middle" font-size="9.5" fill="#475569">stratégie, frontière, arrêt</text>
<rect x="40" y="120" width="250" height="90" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="165.0" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">opérateurs N1/N2</text>
<text x="165.0" y="166.0" text-anchor="middle" font-size="9.5" fill="#334155">neural, classique, hardware</text>
<text x="165.0" y="179.775" text-anchor="middle" font-size="9.5" fill="#334155">proposent des transitions</text>
<line x1="290" y1="165" x2="358" y2="220" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#f)"/>
<text x="300" y="150" text-anchor="start" font-size="9" font-weight="bold" fill="#1d4ed8">proposal</text>
<rect x="670" y="120" width="250" height="90" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="795.0" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6d28d9">store d&#x27;arbres</text>
<text x="795.0" y="166.0" text-anchor="middle" font-size="9.5" fill="#334155">persistance, requête</text>
<text x="795.0" y="179.775" text-anchor="middle" font-size="9.5" fill="#334155">compaction, rejeu</text>
<line x1="600" y1="220" x2="668" y2="165" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#f)"/>
<text x="620" y="245" text-anchor="start" font-size="9" font-weight="bold" fill="#6d28d9">state</text>
<rect x="60" y="380" width="200" height="58" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.3"/>
<text x="160" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">state</text>
<text x="160" y="422" text-anchor="middle" font-size="8.5" fill="#475569">candidats + frontière + empreinte</text>
<rect x="280" y="380" width="200" height="58" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="380" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">proposal</text>
<text x="380" y="422" text-anchor="middle" font-size="8.5" fill="#475569">opérateur + paramètres</text>
<rect x="500" y="380" width="200" height="58" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.3"/>
<text x="600" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">score</text>
<text x="600" y="422" text-anchor="middle" font-size="8.5" fill="#475569">valeur + coût + confiance</text>
<rect x="700" y="380" width="200" height="58" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.3"/>
<text x="800" y="402" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b91c1c">constraint</text>
<text x="800" y="422" text-anchor="middle" font-size="8.5" fill="#475569">domaine + refus</text>
<text x="60" y="462" text-anchor="start" font-size="9.5" font-weight="bold" fill="#15803d">decision : état settled + justification</text>
<text x="60" y="480" text-anchor="start" font-size="9.5" font-weight="bold" fill="#334155">trace : événements + arbre + diff</text>
<rect x="30" y="504" width="900" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="526" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#334155">Le bus transporte state, proposal, decision, trace — pas une « chaîne de pensée ».</text>
</svg>
