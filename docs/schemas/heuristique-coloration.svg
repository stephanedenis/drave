<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="DejaVu Sans, Arial, sans-serif">
<title>La coloration : des candidats, pas un verdict</title>
<desc>Le générateur CPU propose les segments et les attachements ; le réseau ou l&#x27;humain tranche.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="560" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">La coloration : des candidats, pas un verdict</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Le CPU énumère le plausible ; il ne décide pas l&#x27;ambigu. C&#x27;est le contrat de la coloration.</text>
<text x="40" y="104" text-anchor="start" font-size="15" font-weight="bold" fill="#1d4ed8">Le chat</text>
<text x="115" y="104" text-anchor="start" font-size="15" font-weight="bold" fill="#b45309">de la voisine</text>
<text x="230" y="104" text-anchor="start" font-size="15" font-weight="bold" fill="#15803d">qui dort sur le toit</text>
<text x="390" y="104" text-anchor="start" font-size="15" font-weight="bold" fill="#334155">se réveille.</text>
<line x1="40" y1="112" x2="100" y2="112" stroke="#1d4ed8" stroke-width="3"/>
<line x1="115" y1="112" x2="220" y2="112" stroke="#b45309" stroke-width="3"/>
<line x1="230" y1="112" x2="380" y2="112" stroke="#15803d" stroke-width="3"/>
<line x1="390" y1="112" x2="490" y2="112" stroke="#334155" stroke-width="3"/>
<rect x="40" y="150" width="500" height="76" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="56" y="174" text-anchor="start" font-size="11" font-weight="bold" fill="#15803d">C1 · « qui dort » → Le chat</text>
<text x="56" y="194" text-anchor="start" font-size="9.5" fill="#334155">lecture : c&#x27;est le chat qui dort ; le chat est à la voisine.</text>
<rect x="400" y="160" width="120" height="22" rx="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="460.0" y="175.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">compatible</text>
<rect x="40" y="240" width="500" height="76" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
<text x="56" y="264" text-anchor="start" font-size="11" font-weight="bold" fill="#b45309">C2 · « qui dort » → la voisine</text>
<text x="56" y="284" text-anchor="start" font-size="9.5" fill="#334155">lecture : c&#x27;est la voisine qui dort ; le chat est à elle.</text>
<rect x="400" y="250" width="120" height="22" rx="11" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="460.0" y="265.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#b45309">resolu</text>
<rect x="40" y="330" width="500" height="76" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="56" y="354" text-anchor="start" font-size="11" font-weight="bold" fill="#334155">C3 · double sens conservé</text>
<text x="56" y="374" text-anchor="start" font-size="9.5" fill="#334155">deux lectures sortent ensemble, même groupe ; l&#x27;ambiguïté est un fait.</text>
<rect x="400" y="340" width="120" height="22" rx="11" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
<text x="460.0" y="355.0" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">double_sens</text>
<rect x="600" y="92" width="150" height="60" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="675.0" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">générateur</text>
<text x="675.0" y="138.0" text-anchor="middle" font-size="8.5" fill="#334155">règles CPU</text>
<rect x="770" y="92" width="150" height="60" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="845.0" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">candidats</text>
<text x="845.0" y="138.0" text-anchor="middle" font-size="8.5" fill="#334155">segments + rôles</text>
<rect x="600" y="200" width="150" height="60" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="675.0" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">humain / réseau</text>
<text x="675.0" y="246.0" text-anchor="middle" font-size="8.5" fill="#334155">tranche l&#x27;ambiguïté</text>
<rect x="770" y="200" width="150" height="60" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="845.0" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">corpus</text>
<text x="845.0" y="246.0" text-anchor="middle" font-size="8.5" fill="#334155">verdicts + statut</text>
<line x1="750" y1="122" x2="768" y2="122" stroke="#6d28d9" stroke-width="1.4" marker-end="url(#f)"/>
<line x1="845" y1="152" x2="700" y2="198" stroke="#b45309" stroke-width="1.4" marker-end="url(#f)"/>
<line x1="750" y1="230" x2="768" y2="230" stroke="#15803d" stroke-width="1.4" marker-end="url(#f)"/>
<text x="680" y="286" text-anchor="middle" font-size="9.5" fill="#475569">le CPU fait la segmentation ;</text>
<text x="680" y="302" text-anchor="middle" font-size="9.5" fill="#475569">le réseau/humain fait l&#x27;attachement.</text>
<rect x="30" y="440" width="900" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="466" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#334155">Une heuristique qui propose 2 candidats vaut mieux qu&#x27;un classifieur qui en impose un faux.</text>
<text x="480" y="512" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">La coloration n&#x27;est pas un étiquetage final : c&#x27;est une pré-annotation vérifiable.</text>
</svg>
