<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="DejaVu Sans, Arial, sans-serif">
<title>La RSN est un quotient, pas un vecteur</title>
<desc>Plusieurs surfaces, un même corps ; l&#x27;annotation garde le chemin, l&#x27;empreinte ne garde que le sens.</desc>
<defs><marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker><marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker><marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker><marker id="fb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker><marker id="fa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker></defs>
<rect width="960" height="590" fill="#f8fafc"/>
<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">La RSN est un quotient, pas un vecteur</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Le corps est l&#x27;invariant ; l&#x27;annotation est le chemin. Le miroir est une rétraction, pas une copie.</text>
<rect x="30" y="96" width="200" height="84" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="130.0" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">surface A</text>
<text x="130.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#334155">PNG 28 × 28</text>
<text x="130.0" y="157.225" text-anchor="middle" font-size="10.5" fill="#334155">pixels</text>
<rect x="250" y="96" width="200" height="84" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="350.0" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">surface B</text>
<text x="350.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#334155">UTF-8</text>
<text x="350.0" y="157.225" text-anchor="middle" font-size="10.5" fill="#334155">« 7 »</text>
<rect x="470" y="96" width="200" height="84" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="570.0" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">surface C</text>
<text x="570.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#334155">français</text>
<text x="570.0" y="157.225" text-anchor="middle" font-size="10.5" fill="#334155">« sept »</text>
<rect x="690" y="96" width="200" height="84" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="790.0" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">surface D</text>
<text x="790.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#334155">anglais</text>
<text x="790.0" y="157.225" text-anchor="middle" font-size="10.5" fill="#334155">« seven »</text>
<rect x="100" y="220" width="760" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="480" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">canoniseur  c : S → C</text>
<text x="480" y="268" text-anchor="middle" font-size="10.5" fill="#475569">même sens → même corps ; le format, la langue et la source restent dehors</text>
<line x1="130" y1="182" x2="130" y2="218" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<line x1="350" y1="182" x2="350" y2="218" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<line x1="570" y1="182" x2="570" y2="218" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<line x1="790" y1="182" x2="790" y2="218" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<rect x="250" y="320" width="460" height="88" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2.2"/>
<text x="480" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">classe  [s] = { s&#x27; : s&#x27; ~ s }</text>
<text x="480" y="370" text-anchor="middle" font-size="11.5" fill="#334155">corps = { modalite: vision, glyphe: 7 }</text>
<text x="480" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">empreinte  h = H(corps)</text>
<line x1="480" y1="286" x2="480" y2="318" stroke="#b45309" stroke-width="2.2" marker-end="url(#fa)"/>
<rect x="730" y="308" width="200" height="112" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="830.0" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#334155">annotation  a(s)</text>
<text x="830.0" y="354.0" text-anchor="middle" font-size="10" fill="#334155">langue : fr</text>
<text x="830.0" y="368.5" text-anchor="middle" font-size="10" fill="#334155">format : mnist</text>
<text x="830.0" y="383.0" text-anchor="middle" font-size="10" fill="#334155">confiance_pm : 970</text>
<text x="830.0" y="397.5" text-anchor="middle" font-size="10" fill="#334155">source : sha256</text>
<text x="830" y="440" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">hors empreinte</text>
<line x1="700" y1="284" x2="780" y2="306" stroke="#334155" stroke-width="1.8" marker-end="url(#f)"/>
<rect x="30" y="470" width="200" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="130.0" y="494" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">décodeur  d</text>
<text x="130.0" y="516.0" text-anchor="middle" font-size="10" fill="#334155">C × A → S</text>
<text x="130.0" y="530.5" text-anchor="middle" font-size="10" fill="#334155">rend une surface</text>
<path d="M340,408 L130,408 L130,468" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#fb)"/>
<text x="235" y="426" text-anchor="middle" font-size="10.5" fill="#1d4ed8">miroir : c(d(c, a)) = c</text>
<path d="M30,505 L14,505 L14,138 L30,138" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#fb)"/>
<rect x="250" y="470" width="230" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="365" y="494" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">c(s) = c(s&#x27;)  ⇔  s ~ s&#x27;</text>
<text x="365" y="516" text-anchor="middle" font-size="9.5" fill="#475569">le quotient est la définition</text>
<text x="365" y="534" text-anchor="middle" font-size="9.5" fill="#475569">le hash n&#x27;est qu&#x27;un représentant</text>
<rect x="500" y="470" width="200" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="600" y="494" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">P_f : format</text>
<text x="600" y="514" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">doit ÉCHOUER</text>
<text x="600" y="534" text-anchor="middle" font-size="9.5" fill="#475569">sinon la RSN fuit</text>
<rect x="720" y="470" width="210" height="80" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="825" y="494" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">P_y : classe</text>
<text x="825" y="514" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#15803d">doit RÉUSSIR</text>
<text x="825" y="534" text-anchor="middle" font-size="9.5" fill="#475569">sinon la RSN a détruit le sens</text>
</svg>
