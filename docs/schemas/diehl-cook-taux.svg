<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="DejaVu Sans, Arial, sans-serif">
<title>Pourquoi c&#x27;est un modèle de taux</title>
<desc>Le potentiel intègre des taux ; le temps n&#x27;ajoute que de la variance — sauf si on lit le timing.</desc>
