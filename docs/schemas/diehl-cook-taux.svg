<text x="170" y="246" text-anchor="middle" font-size="9.5" fill="#475569">des taux, pas des instants</text>
<line x1="300" y1="175" x2="328" y2="175" stroke="#1d4ed8" stroke-width="2" marker-end="url(#fb)"/>
<rect x="330" y="100" width="300" height="200" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="480" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">le potentiel intègre</text>
<line x1="355" y1="260" x2="610" y2="260" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="355" y1="140" x2="355" y2="275" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="355" y1="165" x2="610" y2="165" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M355,255 C390,250 410,238 430,225 C450,212 465,205 480,190 C495,176 510,170 525,158" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#f)"/>
<text x="600" y="160" text-anchor="end" font-size="9" font-weight="bold" fill="#b91c1c">seuil</text>
<text x="480" y="280" text-anchor="middle" font-size="9.5" fill="#334155">V(T) ≈ V_rest + ΔE · Σ γ_i r_i τ_ge</text>
<text x="480" y="294" text-anchor="middle" font-size="9" fill="#334155">× (1 − e^{−T/τ_m})</text>
<rect x="330" y="320" width="300" height="100" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
<text x="480" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">l&#x27;espérance</text>
<text x="480" y="366" text-anchor="middle" font-size="10.5" fill="#334155">E[V] ∝ Σ w_i r_i</text>
<text x="480" y="388" text-anchor="middle" font-size="10.5" fill="#334155">Var[V] = O(Σ γ_i² r_i τ_ge)</text>
<text x="480" y="408" text-anchor="middle" font-size="9.5" fill="#475569">la décision est un argmax de taux</text>
<rect x="660" y="100" width="270" height="200" rx="9" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
<text x="795" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">l&#x27;erreur d&#x27;estimation</text>
<line x1="690" y1="260" x2="910" y2="260" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="690" y1="140" x2="690" y2="275" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M695,150 C720,190 760,225 810,240 C845,250 880,254 905,256" fill="none" stroke="#15803d" stroke-width="2.2" marker-end="url(#f)"/>
<text x="700" y="140" text-anchor="start" font-size="9" font-weight="bold" fill="#15803d">1/√T</text>
<line x1="835" y1="250" x2="835" y2="262" stroke="#b91c1c" stroke-width="1.2"/>
<text x="835" y="278" text-anchor="middle" font-size="9" fill="#b91c1c">T = 350 ms</text>
<text x="795" y="286" text-anchor="middle" font-size="9" fill="#475569">le taux est bien estimé</text>
<rect x="660" y="320" width="270" height="100" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="795" y="344" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">le contrôle qui tranche</text>
<text x="795" y="366" text-anchor="middle" font-size="10.5" fill="#334155">lecture taux seul</text>
<text x="795" y="388" text-anchor="middle" font-size="9.5" fill="#475569">si elle fait aussi bien,</text>
<text x="795" y="406" text-anchor="middle" font-size="9.5" fill="#475569">le timing n&#x27;apporte rien.</text>
<rect x="30" y="448" width="900" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="480" y="476" text-anchor="middle" font-size="10.5" fill="#334155">Si la lecture taux seul fait moins bien, il y a un effet temporel à expliquer — une découverte, pas une hypothèse.</text>
</svg>
