<text x="480.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Du mot au document : ce que le CPU peut étiqueter</text>
<text x="480" y="58" text-anchor="middle" font-size="13" fill="#475569">Le CPU ne remplace pas le réseau : il lui enlève la surface.</text>
