<text x="480" y="612" text-anchor="middle" font-size="9.5" fill="#334155">vert : heuristique CPU   ·   ambre : cascade (candidats CPU, choix réseau/humain)   ·   rouge : réseau</text>
<text x="480" y="638" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">Un niveau n&#x27;est pas « heuristique » ou « réseau » : il est un dosage, et le dosage se mesure.</text>
