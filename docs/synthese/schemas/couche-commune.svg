<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
    <marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker>
  </defs>
  <rect width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Une couche commune, et la langue comme PARAMÈTRE</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#475569">Le but : un seul espace entrée-sortie, où le français, l&#8217;anglais ou le wolof sont des réglages, pas des chemins.</text>

  <!-- les entrees par langue -->
  <rect x="40" y="90" width="180" height="150" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="130" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">ENTRÉES</text>
  <text x="130" y="146" text-anchor="middle" font-size="12.5" fill="#1d4ed8">« le chat dort »</text>
  <text x="130" y="172" text-anchor="middle" font-size="12.5" fill="#1d4ed8">« the cat sleeps »</text>
  <text x="130" y="198" text-anchor="middle" font-size="12.5" fill="#1d4ed8">« نائم القط »</text>
  <text x="130" y="224" text-anchor="middle" font-size="11.5" fill="#475569">+ langue · dialecte · style</text>

  <!-- la couche commune -->
  <rect x="290" y="80" width="330" height="180" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <text x="455" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">LA COUCHE COMMUNE</text>
  <text x="455" y="132" text-anchor="middle" font-size="12" fill="#475569">le SENS, sans langue</text>
  <rect x="315" y="150" width="280" height="44" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="455" y="178" text-anchor="middle" font-size="12.5" fill="#0f172a">état partagé (un vecteur, pas un mot)</text>
  <rect x="315" y="204" width="280" height="40" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="455" y="230" text-anchor="middle" font-size="12.5" fill="#0f172a">entrée ⇄ sortie : la MÊME matrice</text>

  <!-- les parametres -->
  <rect x="290" y="290" width="330" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="455" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">LES PARAMÈTRES (petits, explicites)</text>
  <text x="455" y="342" text-anchor="middle" font-size="12" fill="#b45309">langue · dialecte · registre · style · époque</text>
  <text x="455" y="366" text-anchor="middle" font-size="11.5" fill="#475569">quelques dizaines de dimensions, pas des milliards</text>
  <text x="455" y="388" text-anchor="middle" font-size="11.5" fill="#475569">ils modulent la SURFACE, ils ne portent pas le sens</text>

  <!-- les sorties -->
  <rect x="680" y="90" width="180" height="150" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="770" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">SORTIES</text>
  <text x="770" y="146" text-anchor="middle" font-size="12.5" fill="#15803d">« le chat dort »</text>
  <text x="770" y="172" text-anchor="middle" font-size="12.5" fill="#15803d">« the cat sleeps »</text>
  <text x="770" y="198" text-anchor="middle" font-size="12.5" fill="#15803d">« نائم القط »</text>
  <text x="770" y="224" text-anchor="middle" font-size="11.5" fill="#475569">+ langue · dialecte · style</text>

  <line x1="222" y1="165" x2="286" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="624" y1="165" x2="678" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="455" y1="262" x2="455" y2="288" stroke="#b45309" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="400" y1="288" x2="400" y2="264" stroke="#b45309" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="450" y="278" text-anchor="middle" font-size="10.5" fill="#b45309">module la surface</text>

  <!-- le critere mesurable -->
  <text x="450" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Le critère qui décide : un classifieur de LANGUE sur la couche commune doit être AU HASARD</text>
  <text x="450" y="466" text-anchor="middle" font-size="12.5" fill="#15803d">S&#8217;il devine la langue mieux que le hasard, la couche n&#8217;abstrait pas : elle porte encore la langue ✗</text>
  <text x="450" y="492" text-anchor="middle" font-size="12.5" fill="#475569">Et le second critère : la MÊME représentation doit suffire à reconstruire un texte dans DEUX langues.</text>
  <text x="450" y="524" text-anchor="middle" font-size="12" fill="#475569">Ce qui est déjà acquis ici : les modèles-jouets sont en OCTETS (un seul vocabulaire pour tout) — la langue n&#8217;y est pas dans le vocabulaire.</text>
</svg>
