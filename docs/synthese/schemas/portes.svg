<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
    <marker id="fr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b91c1c"/></marker>
    <marker id="fv" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker>
  </defs>
  <rect width="900" height="460" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Les portes : la seule façon de croire un chiffre</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#475569">46 vérifications, chacune capable d&#8217;échouer — et un registre qui garde les codes de sortie.</text>
  <rect x="50" y="110" width="190" height="110" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="145.0" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">une porte</text>
  <text x="145.0" y="206" text-anchor="middle" font-size="11.5" fill="#475569">un script qui teste</text>
  <line x1="242" y1="165" x2="262" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <rect x="265" y="110" width="190" height="110" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="360.0" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">code 0</text>
  <text x="360.0" y="206" text-anchor="middle" font-size="11.5" fill="#475569">vert</text>
  <line x1="457" y1="165" x2="477" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <rect x="480" y="110" width="190" height="110" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="575.0" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">code 1-9</text>
  <text x="575.0" y="206" text-anchor="middle" font-size="11.5" fill="#475569">rouge, et il DIT pourquoi</text>
  <line x1="672" y1="165" x2="692" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <rect x="695" y="110" width="190" height="110" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="790.0" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">registre</text>
  <text x="790.0" y="206" text-anchor="middle" font-size="11.5" fill="#475569">ce qu&#8217;on relit</text>
  <text x="450" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">La passe complète : 46 portes, 44 vertes, 2 rouges — 97 minutes</text>
  <text x="450" y="316" text-anchor="middle" font-size="12.5" fill="#475569">Les deux rouges sont les structurels connus (porte-indice, porte-melange) : aucun rouge nouveau.</text>
  <text x="450" y="348" text-anchor="middle" font-size="13" fill="#b91c1c">Trois règles apprises à la dure : une porte doit pouvoir ÉCHOUER ;</text>
  <text x="450" y="372" text-anchor="middle" font-size="13" fill="#b91c1c">le verdict se lit au CODE DE SORTIE, jamais au marqueur ;</text>
  <text x="450" y="396" text-anchor="middle" font-size="13" fill="#b91c1c">et une porte rouge qu&#8217;on contourne n&#8217;est pas une porte.</text>
</svg>
