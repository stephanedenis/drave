<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="DejaVu Sans, Arial, sans-serif">
  <title>Le bus : des faits, pas des matrices</title>
  <desc>Une activation est un fait ; les faits forment une liste valuée poussée sur le bus vers les régions.</desc>
  <defs>
    <marker id="f" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
  </defs>
  <rect width="900" height="420" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Le bus : des faits, pas des matrices</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#475569">Une activation est un fait — « le neurone 2 539 de la couche 23 a valu 27,8 » — et un fait se pousse.</text>

  <rect x="30" y="95" width="230" height="230" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="145" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Les faits</text>
  <text x="145" y="158" text-anchor="middle" font-size="12" fill="#334155">couche 23 · neurone 2 539</text>
  <text x="145" y="180" text-anchor="middle" font-size="12" fill="#334155">couche 23 · neurone 118</text>
  <text x="145" y="202" text-anchor="middle" font-size="12" fill="#334155">couche 24 · neurone 7</text>
  <text x="145" y="238" text-anchor="middle" font-size="11.5" fill="#475569">indice + valeur, groupés par source</text>
  <text x="145" y="260" text-anchor="middle" font-size="11.5" fill="#475569">pas de zéros à transporter</text>
  <text x="145" y="296" text-anchor="middle" font-size="12.5" fill="#1d4ed8">le coût suit l'activité</text>

  <rect x="310" y="140" width="160" height="140" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="390" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">La liste</text>
  <text x="390" y="198" text-anchor="middle" font-size="12" fill="#334155">valuée</text>
  <text x="390" y="220" text-anchor="middle" font-size="12" fill="#334155">groupée</text>
  <text x="390" y="242" text-anchor="middle" font-size="12" fill="#334155">poussée</text>
  <text x="390" y="268" text-anchor="middle" font-size="11.5" fill="#475569">vers ses lecteurs</text>

  <rect x="520" y="140" width="150" height="140" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="595" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Le bus</text>
  <text x="595" y="198" text-anchor="middle" font-size="12" fill="#334155">messages</text>
  <text x="595" y="220" text-anchor="middle" font-size="12" fill="#334155">taille fixe</text>
  <text x="595" y="242" text-anchor="middle" font-size="12" fill="#334155">priorités</text>
  <text x="595" y="268" text-anchor="middle" font-size="11.5" fill="#475569">horodatés, rejouables</text>

  <rect x="720" y="95" width="150" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="795" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">région A</text>
  <text x="795" y="154" text-anchor="middle" font-size="11.5" fill="#475569">lit, calcule, écrit</text>
  <rect x="720" y="225" width="150" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="795" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">région B</text>
  <text x="795" y="284" text-anchor="middle" font-size="11.5" fill="#475569">lit, calcule, écrit</text>

  <line x1="262" y1="210" x2="308" y2="210" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="472" y1="210" x2="518" y2="210" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="672" y1="190" x2="718" y2="150" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="672" y1="230" x2="718" y2="270" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="795" y1="197" x2="795" y2="223" stroke="#334155" stroke-width="2.5" marker-end="url(#f)"/>

  <text x="450" y="366" text-anchor="middle" font-size="13" fill="#0f172a">1 608 octets par flux à 256 jetons · 0,25 Mbit/s · latence ≤ 20 ms</text>
  <text x="450" y="392" text-anchor="middle" font-size="12.5" fill="#475569">Le flux n'est pas un sous-produit : c'est l'instrument de réglage, et il se rejoue.</text>
</svg>
